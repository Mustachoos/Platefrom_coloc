<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Upload photos</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/site.css' %}">
</head>
<body>
  <main class="card">
    <h1>Upload photos to the TV</h1>
    <p class="as-user">Uploading as <strong>{{ pseudo }}</strong></p>

    {% if messages %}
    <div class="messages">
      {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <label for="images">Photos</label>
      <input type="file" id="images" name="images" accept="image/*" multiple required>
      <button type="submit">Upload</button>
    </form>

  <a class="tv-link" href="{% url 'my-photos' %}">My photos &rarr;</a>
  <br>
  <a class="gallery-link" href="{% url 'gallery' %}">Go to gallery &rarr;</a>
  </main>
</body>
</html>

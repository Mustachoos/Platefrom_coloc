<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Upload photos</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/site.css' %}">
</head>
<body class="centered-page has-footer-nav">
  <main class="card">
    <div class="upload-top">
      <h1>Upload photos to the TV</h1>
      <p class="as-user">Uploading as <strong>{{ pseudo }}</strong></p>

      {% if messages %}
      <div class="messages">
        {% for message in messages %}
        <div class="message {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
    </div>

    <div class="upload-center">
      <div id="photo-status"
           class="photo-status {% if just_uploaded %}state-success{% else %}state-empty{% endif %}"
           data-just-uploaded="{{ just_uploaded|yesno:'1,0' }}"
      >{% if just_uploaded %}Upload successful{% else %}No photo yet :({% endif %}</div>
    </div>

    <form id="upload-form" method="post" enctype="multipart/form-data" class="upload-bottom">
      {% csrf_token %}
      <div class="form-row">
        <label class="form-row-label-centered">Add a photo</label>
        <input type="file" id="images" name="images" accept="image/*" style="display:none">
        <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
        <div class="form-actions">
          <button type="button" id="choose-btn" class="btn secondary">&#128444;&#65039; Choose a photo</button>
          <button type="button" id="camera-btn" class="btn secondary">&#128247; Take a photo</button>
        </div>
      </div>

      <div class="upload-actions">
        <button id="upload-btn" type="submit" class="btn neutral large">Upload</button>
      </div>
    </form>

    <script>
      (function(){
        const input = document.getElementById('images');
        const btn = document.getElementById('upload-btn');
        const form = document.getElementById('upload-form');
        const chooseBtn = document.getElementById('choose-btn');
        const cameraInput = document.getElementById('camera-input');
        const cameraBtn = document.getElementById('camera-btn');
        const status = document.getElementById('photo-status');
        const cameraFiles = new Set();
        const justUploaded = !!status && status.dataset.justUploaded === '1';

        // Drop the one-time flag from the URL so a page refresh doesn't
        // replay the "Upload successful" state.
        if (justUploaded && window.history && window.history.replaceState) {
          const url = new URL(window.location.href);
          url.searchParams.delete('uploaded');
          window.history.replaceState({}, '', url);
        }

        function setStatus(state, text) {
          if (!status) return;
          status.classList.remove('state-empty', 'state-selected', 'state-success');
          status.classList.add('state-' + state);
          status.textContent = text;
        }

        function updateSelectionStatus() {
          if (input.files && input.files.length > 0) {
            const file = input.files[0];
            setStatus('selected', cameraFiles.has(file) ? 'I see you took a nice picture !' : file.name);
          } else {
            setStatus('empty', 'No photo yet :(');
          }
        }

        function update(){
          if(!input) return;
          if(input.files && input.files.length>0){
            btn.classList.add('ready');
          } else {
            btn.classList.remove('ready');
          }
          updateSelectionStatus();
        }

        if (chooseBtn && input) {
          chooseBtn.addEventListener('click', function () {
            input.click();
          });
        }

        if (cameraBtn && cameraInput) {
          cameraBtn.addEventListener('click', function () {
            cameraInput.click();
          });
          // Only one photo at a time: a freshly taken photo replaces
          // whatever was previously selected, rather than adding to it.
          cameraInput.addEventListener('change', function () {
            if (!cameraInput.files || cameraInput.files.length === 0) return;
            cameraFiles.clear();
            const replaced = new DataTransfer();
            const file = cameraInput.files[0];
            replaced.items.add(file);
            cameraFiles.add(file);
            input.files = replaced.files;
            cameraInput.value = '';
            update();
          });
        }

        input.addEventListener('change', update);

        if (form && status) {
          form.addEventListener('submit', function (e) {
            if (!input.files || input.files.length === 0) {
              e.preventDefault();
              status.classList.remove('shake');
              // Force a reflow so the animation restarts if triggered again
              // right away (e.g. clicking Upload twice with nothing chosen).
              void status.offsetWidth;
              status.classList.add('shake');
            }
          });
          status.addEventListener('animationend', function () {
            status.classList.remove('shake');
          });
        }

        document.addEventListener('DOMContentLoaded', function () {
          if (justUploaded) {
            // Already server-rendered as "Upload successful"; just schedule
            // the transition back to the empty state.
            setTimeout(function () {
              setStatus('empty', 'No photo yet :(');
            }, 3000);
          } else {
            update();
          }
        });
      })();
    </script>
  </main>
  {% include "photos/_footer_nav.html" %}
</body>
</html>

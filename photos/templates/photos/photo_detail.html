<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ photo.filename }}</title>
  <style>
    :root {
      --bg-1: #effcf6;
      --bg-2: #fff5e8;
      --ink: #223449;
      --soft: #5f768c;
      --card: rgba(255, 255, 255, 0.94);
      --card-border: rgba(255, 255, 255, 0.88);
      --btn-1: #16a34a;
      --btn-2: #10b981;
      --danger-1: #dc2626;
      --danger-2: #ef4444;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(16, 185, 129, 0.18), transparent 30%),
        radial-gradient(circle at 88% 86%, rgba(251, 146, 60, 0.17), transparent 34%),
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
    }

    .card {
      width: min(100%, 620px);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(31, 52, 72, 0.16);
      padding: clamp(22px, 3.8vw, 34px);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      animation: rise 0.55s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(1.3rem, 3.4vw, 1.7rem);
      line-height: 1.2;
      word-break: break-all;
    }

    img {
      display: block;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(31, 52, 72, 0.18);
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.back {
      background: linear-gradient(90deg, var(--btn-1), var(--btn-2));
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.3);
    }

    .btn.delete {
      background: linear-gradient(90deg, var(--danger-1), var(--danger-2));
      box-shadow: 0 8px 18px rgba(220, 38, 38, 0.3);
    }

    form {
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>{{ photo.filename }}</h1>
    <img src="{{ photo.image.url }}" alt="{{ photo.filename }}">
    <div class="actions">
      <a class="btn back" href="{% url 'my-photos' %}">&larr; Back</a>
      <form method="post" action="{% url 'delete-own-photo' photo.id %}" onsubmit="return confirm('Delete this photo?');">
        {% csrf_token %}
        <button type="submit" class="btn delete">Delete photo</button>
      </form>
    </div>
  </main>
</body>
</html>

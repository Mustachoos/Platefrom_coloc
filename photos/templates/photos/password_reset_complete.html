<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Password changed</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'photos/base.css' %}">
  <link rel="stylesheet" href="{% static 'photos/components.css' %}">
</head>
<body>
  <div class="page shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <main class="card" style="width:100%;max-width:420px;">
      <h1>Password changed</h1>
      <p class="text-muted" style="margin-top:var(--space-2xs);">Your password has been set. You can sign in with it now.</p>
      <div class="flex flex-wrap gap-sm items-center" style="margin-top:var(--space-md);">
        <a class="btn btn--dark" href="{% url 'staff-login' %}">Sign in</a>
      </div>
    </main>
  </div>
</body>
</html>

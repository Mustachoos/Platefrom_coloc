<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff sign in</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'photos/base.css' %}">
  <link rel="stylesheet" href="{% static 'photos/components.css' %}">
</head>
<body>
  <div class="page shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <main class="card" style="width:100%;max-width:420px;">
      <h1>Staff sign in</h1>
      <p class="text-muted" style="margin-top:var(--space-2xs);margin-bottom:var(--space-md);">Sign in with your admin or subadmin account to reach the dashboard.</p>

      {% if form.non_field_errors %}
      <div class="alert alert--boxed" style="margin-bottom:var(--space-md);">{{ form.non_field_errors|join:" " }}</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }}
        </div>
        <div class="field" style="margin-top:var(--space-sm);">
          <label for="{{ form.password.id_for_label }}">Password</label>
          {{ form.password }}
        </div>
        <div class="flex flex-wrap gap-sm items-center" style="margin-top:var(--space-md);">
          <button type="submit" class="btn btn--dark">Sign in</button>
          <a class="link text-sm" href="{% url 'password-reset' %}">Forgot password?</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>

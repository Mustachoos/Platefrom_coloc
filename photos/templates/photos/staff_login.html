<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff sign in</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/site.css' %}">
</head>
<body class="centered-page">
  <main class="card">
    <h1>Staff sign in</h1>
    <p class="hint">Sign in with your admin or subadmin account to reach the dashboard.</p>

    {% if form.non_field_errors %}
    <div class="message error">{{ form.non_field_errors|join:" " }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <label for="{{ form.username.id_for_label }}">Username</label>
        {{ form.username }}
      </div>
      <div class="form-row">
        <label for="{{ form.password.id_for_label }}">Password</label>
        {{ form.password }}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">Sign in</button>
      </div>
    </form>
  </main>
</body>
</html>

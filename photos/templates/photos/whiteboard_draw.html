<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>Whiteboard</title>
  {% load static %}
  {% load icons %}
  <link rel="stylesheet" href="{% static 'photos/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'photos/base.css' %}">
  <link rel="stylesheet" href="{% static 'photos/components.css' %}">
  <style>
    /* Everything below is page-specific positioning math that has no
       equivalent in the shared component files (a full-screen canvas
       inset between a header and a floating nav pill isn't a reusable
       "component" — see the plan notes). Visual chrome (colors, radii,
       shadows) still comes entirely from tokens.css/components.css via
       .fab/.tool-panel/.tool-row below; only position/transform/size is
       set here. --wb-stage-top/--wb-stage-bottom are computed at runtime
       from the header's and bottom-nav's real rendered geometry (neither
       is a fixed-height fixture in the new shell, unlike the old one). */
    html, body { margin: 0; padding: 0; overflow: hidden; }
    .wb-stage {
      position: fixed;
      top: var(--wb-stage-top, 66px);
      left: 10px;
      right: 10px;
      bottom: var(--wb-stage-bottom, 86px);
      display: flex;
    }
    .canvas-viewport { position: relative; overflow: hidden; width: 100%; height: 100%; background: #000; touch-action: none; border-radius: var(--radius-lg); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .canvas-transform { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
    .canvas-frame { position: relative; }
    .canvas-frame canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; }
    #board-canvas { z-index: 1; }
    #draw-canvas { z-index: 2; cursor: crosshair; }
    #draw-canvas.pan-mode { cursor: grab; }
    #draw-canvas.pan-mode.panning { cursor: grabbing; }

    .zoom-controls { position: absolute; top: 10px; right: 10px; display: flex; flex-direction: column; gap: var(--space-2xs); z-index: 5; }

    .fab-cluster { position: fixed; right: 16px; bottom: var(--wb-stage-bottom, 86px); z-index: 9; }
    #upload-btn { width: 56px; height: 56px; flex-direction: column; gap: 0; }
    #upload-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    #save-timer { font-size: var(--text-xs); font-weight: 700; line-height: 1; }

    #upload-status {
      position: fixed;
      right: 16px;
      bottom: calc(var(--wb-stage-bottom, 86px) + 68px);
      background: var(--surface-solid);
      padding: var(--space-2xs) var(--space-sm);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      font-weight: 700;
      color: var(--ink-600);
      box-shadow: var(--shadow-md);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--base) var(--ease), transform var(--base) var(--ease);
      transform: translateY(4px);
      white-space: nowrap;
      z-index: 9;
      max-width: min(70vw, 320px);
      text-align: right;
    }
    #upload-status.visible { opacity: 1; transform: translateY(0); }

    /* Tools sheet: the visual chrome is .tool-panel as given; only the
       fixed positioning + slide transform is added here, since the new
       component set doesn't ship an open/closed state for it.
       Anchored flush to the true viewport bottom (not to
       --wb-stage-bottom) with the nav clearance folded into padding
       instead — translateY(100%) only clears an element's OWN height, so
       anchoring it `bottom: <clearance>` and translating by 100% leaves
       exactly `<clearance>` still on-screen when closed. The old fixed
       full-width footer bar hid that leftover sliver (same height,
       opaque, higher z-index); the new floating nav pill doesn't cover
       that region, so the sliver would actually show without this. */
    #options-panel {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 0;
      padding-bottom: calc(var(--space-md) + var(--wb-stage-bottom, 86px));
      transform: translateY(100%);
      pointer-events: none;
      transition: transform 220ms var(--ease);
      z-index: 8;
      max-height: min(65vh, 520px);
      overflow-y: auto;
    }
    #options-panel.open { transform: translateY(0); pointer-events: auto; }

    .hue-preview-dot { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--surface-solid); box-shadow: 0 0 0 1px var(--line-strong); flex: 0 0 auto; }
  </style>
</head>
<body>
  <!-- No .page/.shell wrapper on this page (the canvas below needs
       position:fixed independent of normal page flow/padding), so the
       header needs its own copy of .page's inset instead of inheriting it. -->
  <div style="padding:var(--space-md) var(--space-md) 0;">
    {% include "photos/_page_header.html" with page_icon="palette" page_title="Whiteboard" %}
  </div>

  <div class="wb-stage" id="wb-stage">
    <div class="canvas-viewport" id="canvas-viewport">
      <div class="canvas-transform" id="canvas-transform">
        <div class="canvas-frame" id="canvas-frame" style="width:{{ board_width }}px;height:{{ board_height }}px">
          <canvas id="board-canvas" width="{{ board_width }}" height="{{ board_height }}"></canvas>
          <canvas id="draw-canvas" width="{{ board_width }}" height="{{ board_height }}"></canvas>
        </div>
      </div>
      <div class="zoom-controls">
        <button type="button" id="zoom-in-btn" class="fab fab--light" aria-label="Zoom in">{% icon 'zoom-in' size=18 %}</button>
        <button type="button" id="zoom-out-btn" class="fab fab--light" aria-label="Zoom out">{% icon 'zoom-out' size=18 %}</button>
        <button type="button" id="zoom-reset-btn" class="fab fab--light" aria-label="Fit to screen">{% icon 'maximize' size=18 %}</button>
      </div>
    </div>
  </div>

  <div class="fab-stack fab-cluster">
    <button type="button" id="upload-btn" class="fab fab--dark" aria-label="Add to the whiteboard">
      <span id="save-icon">{% icon 'check' size=20 %}</span>
      <span id="save-timer" style="display:none"></span>
    </button>
    <button type="button" id="options-toggle" class="fab fab--light" aria-label="Pen options">{% icon 'adjustments-horizontal' size=20 %}</button>
  </div>
  <div id="upload-status"></div>

  <div class="tool-panel" id="options-panel">
    <p class="text-sm text-muted" style="margin-bottom:var(--space-sm);">Drawing as <strong style="color:var(--ink-900);">{{ pseudo }}</strong></p>
    <div class="tool-row">
      <span class="tool-row__label">Mode</span>
      <div class="segmented">
        <button type="button" id="mode-simple" class="segmented__option is-active">Simple</button>
        <button type="button" id="mode-artist" class="segmented__option">Artiste</button>
      </div>
    </div>

    <div class="tool-row" id="simple-colors">
      <span class="tool-row__label">Color</span>
      <div class="swatch-row">
        <button type="button" class="swatch is-selected" data-color="#000000" style="background:#000000" aria-label="Black"></button>
        <button type="button" class="swatch" data-color="#ffffff" style="background:#ffffff" aria-label="White"></button>
        <button type="button" class="swatch" data-color="#2563eb" style="background:#2563eb" aria-label="Blue"></button>
        <button type="button" class="swatch" data-color="#16a34a" style="background:#16a34a" aria-label="Green"></button>
        <button type="button" class="swatch" data-color="#dc2626" style="background:#dc2626" aria-label="Red"></button>
      </div>
    </div>

    <div class="tool-row" id="artist-colors" style="display:none">
      <span class="tool-row__label">Color</span>
      <input type="range" id="hue-slider" class="slider slider--spectrum grow" min="0" max="359" value="0" aria-label="Hue">
      <div class="hue-preview-dot" id="hue-preview" style="background:#ff0000"></div>
      <button type="button" id="eyedropper-btn" class="btn btn--light btn--sm">{% icon 'color-picker' size=16 %} Pipette</button>
    </div>

    <div class="tool-row">
      <span class="tool-row__label">Pen size</span>
      <input type="range" id="pen-size" class="slider grow" min="1" max="{{ pen_max }}" value="8" aria-label="Pen size">
      <span id="pen-size-label" class="text-sm text-muted">8px</span>
    </div>

    <div class="tool-row">
      <span class="tool-row__label">Canvas</span>
      <button type="button" id="pan-btn" class="btn btn--light btn--sm">{% icon 'hand-move' size=16 %} Pan</button>
      <button type="button" id="clear-btn" class="btn btn--light btn--sm">{% icon 'eraser' size=16 %} Clear</button>
    </div>
  </div>

  {% include "photos/_footer_nav.html" %}

  <form style="display:none">{% csrf_token %}</form>

  <script>
  (function () {
    const BOARD_IMAGE_URL = "{{ board_image_url|escapejs }}";
    const UPLOAD_URL = "{% url 'whiteboard-upload' %}";
    const COOLDOWN_SECONDS = {{ cooldown_seconds }};
    let cooldownRemaining = {{ cooldown_remaining }};

    // ---- Fixed-chrome geometry: the header and bottom-nav are no longer
    // constant-height fixtures (the new shell doesn't hardcode 56px like
    // the old one did), so measure their real rendered position instead.
    const header = document.querySelector('.view-header');
    const bottomNav = document.querySelector('.bottom-nav');
    function syncStageGeometry() {
      const inset = 10;
      const top = (header ? header.getBoundingClientRect().bottom : 0) + inset;
      const bottom = (bottomNav ? (window.innerHeight - bottomNav.getBoundingClientRect().top) : 0) + inset;
      document.documentElement.style.setProperty('--wb-stage-top', top + 'px');
      document.documentElement.style.setProperty('--wb-stage-bottom', bottom + 'px');
    }
    syncStageGeometry();
    // Re-measure once everything has actually finished loading, not just
    // parsed — mobile browsers are known to report viewport/layout numbers
    // early that shift slightly once fonts/images settle (the same class of
    // "measured too soon" bug --wb-header-h used to guard against when it
    // was a hardcoded constant instead of measured).
    window.addEventListener('load', syncStageGeometry);

    const viewport = document.getElementById('canvas-viewport');
    const transformEl = document.getElementById('canvas-transform');
    const boardCanvas = document.getElementById('board-canvas');
    const drawCanvas = document.getElementById('draw-canvas');
    const boardCtx = boardCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');

    const optionsToggle = document.getElementById('options-toggle');
    const optionsPanel = document.getElementById('options-panel');
    const modeSimpleBtn = document.getElementById('mode-simple');
    const modeArtistBtn = document.getElementById('mode-artist');
    const simpleColors = document.getElementById('simple-colors');
    const artistColors = document.getElementById('artist-colors');
    const hueSlider = document.getElementById('hue-slider');
    const huePreview = document.getElementById('hue-preview');
    const eyedropperBtn = document.getElementById('eyedropper-btn');
    const panBtn = document.getElementById('pan-btn');
    const penSize = document.getElementById('pen-size');
    const penSizeLabel = document.getElementById('pen-size-label');
    const clearBtn = document.getElementById('clear-btn');
    const zoomInBtn = document.getElementById('zoom-in-btn');
    const zoomOutBtn = document.getElementById('zoom-out-btn');
    const zoomResetBtn = document.getElementById('zoom-reset-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const saveIcon = document.getElementById('save-icon');
    const saveTimer = document.getElementById('save-timer');
    const uploadStatus = document.getElementById('upload-status');

    let statusHideTimeout = null;
    function showStatus(text, autoHideMs) {
      uploadStatus.textContent = text;
      uploadStatus.classList.add('visible');
      if (statusHideTimeout) clearTimeout(statusHideTimeout);
      if (autoHideMs) {
        statusHideTimeout = setTimeout(() => uploadStatus.classList.remove('visible'), autoHideMs);
      }
    }

    let currentColor = '#000000';
    let eyedropperActive = false;
    let panModeActive = false;
    let drawingStroke = false;

    function getCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? v.pop() : '';
    }
    const csrftoken = getCookie('csrftoken');

    // ---- Zoom / pan ----
    const BOARD_W = {{ board_width }};
    const BOARD_H = {{ board_height }};

    function computeFitZoom() {
      return Math.min(viewport.clientWidth / BOARD_W, viewport.clientHeight / BOARD_H);
    }

    let fitZoom = computeFitZoom();
    let zoom = fitZoom;
    let minZoom = fitZoom;
    let maxZoom = fitZoom * 6;
    let panX = 0;
    let panY = 0;

    function applyTransform() {
      transformEl.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoom + ')';
    }

    function clampPan() {
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      const cw = BOARD_W * zoom;
      const ch = BOARD_H * zoom;
      panX = cw <= vw ? (vw - cw) / 2 : Math.min(0, Math.max(vw - cw, panX));
      panY = ch <= vh ? (vh - ch) / 2 : Math.min(0, Math.max(vh - ch, panY));
    }

    function zoomAt(cx, cy, newZoom) {
      newZoom = Math.min(maxZoom, Math.max(minZoom, newZoom));
      if (newZoom === zoom) return;
      const worldX = (cx - panX) / zoom;
      const worldY = (cy - panY) / zoom;
      zoom = newZoom;
      panX = cx - worldX * zoom;
      panY = cy - worldY * zoom;
      clampPan();
      applyTransform();
    }

    function resetView() {
      zoom = fitZoom;
      clampPan();
      applyTransform();
    }
    resetView();

    function handleResize() {
      syncStageGeometry();
      const ratio = zoom / fitZoom;
      fitZoom = computeFitZoom();
      minZoom = fitZoom;
      maxZoom = fitZoom * 6;
      zoom = Math.min(maxZoom, Math.max(minZoom, fitZoom * ratio));
      clampPan();
      applyTransform();
    }
    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', handleResize);

    zoomInBtn.addEventListener('click', () => {
      const r = viewport.getBoundingClientRect();
      zoomAt(r.width / 2, r.height / 2, zoom * 1.4);
    });
    zoomOutBtn.addEventListener('click', () => {
      const r = viewport.getBoundingClientRect();
      zoomAt(r.width / 2, r.height / 2, zoom / 1.4);
    });
    zoomResetBtn.addEventListener('click', resetView);

    viewport.addEventListener('wheel', (evt) => {
      evt.preventDefault();
      const rect = viewport.getBoundingClientRect();
      const cx = evt.clientX - rect.left;
      const cy = evt.clientY - rect.top;
      zoomAt(cx, cy, zoom * (evt.deltaY < 0 ? 1.15 : 1 / 1.15));
    }, { passive: false });

    // ---- Options panel ----
    function setOptionsOpen(open) {
      optionsPanel.classList.toggle('open', open);
      optionsToggle.classList.toggle('fab--dark', open);
      optionsToggle.classList.toggle('fab--light', !open);
    }
    optionsToggle.addEventListener('click', () => {
      setOptionsOpen(!optionsPanel.classList.contains('open'));
    });

    // ---- Board (reference) layer ----
    function refreshBoardBackground(url) {
      if (!url) {
        boardCtx.fillStyle = '#ffffff';
        boardCtx.fillRect(0, 0, boardCanvas.width, boardCanvas.height);
        return;
      }
      const img = new Image();
      img.onload = () => boardCtx.drawImage(img, 0, 0, boardCanvas.width, boardCanvas.height);
      img.src = url;
    }
    refreshBoardBackground(BOARD_IMAGE_URL);

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(protocol + '://' + location.host + '/ws/tv/');
      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.event === 'whiteboard_updated') {
          refreshBoardBackground(data.url);
        }
      };
      ws.onclose = () => {
        setTimeout(connectWebSocket, 3000);
      };
    }
    connectWebSocket();

    // ---- Mode / color ----
    function hslToHex(h, s, l) {
      s /= 100;
      l /= 100;
      const k = (n) => (n + h / 30) % 12;
      const a = s * Math.min(l, 1 - l);
      const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      const toHex = (x) => Math.round(255 * x).toString(16).padStart(2, '0');
      return '#' + toHex(f(0)) + toHex(f(8)) + toHex(f(4));
    }
    function hueToHex(hue) {
      return hslToHex(hue, 100, 50);
    }

    function setMode(mode) {
      const simple = mode === 'simple';
      modeSimpleBtn.classList.toggle('is-active', simple);
      modeArtistBtn.classList.toggle('is-active', !simple);
      simpleColors.style.display = simple ? 'flex' : 'none';
      artistColors.style.display = simple ? 'none' : 'flex';
      eyedropperActive = false;
      eyedropperBtn.classList.remove('btn--dark');
      eyedropperBtn.classList.add('btn--light');
      currentColor = simple
        ? simpleColors.querySelector('.swatch.is-selected').dataset.color
        : hueToHex(Number(hueSlider.value));
    }
    modeSimpleBtn.addEventListener('click', () => setMode('simple'));
    modeArtistBtn.addEventListener('click', () => setMode('artist'));

    simpleColors.querySelectorAll('.swatch').forEach((btn) => {
      btn.addEventListener('click', () => {
        simpleColors.querySelectorAll('.swatch').forEach((b) => b.classList.remove('is-selected'));
        btn.classList.add('is-selected');
        currentColor = btn.dataset.color;
      });
    });

    hueSlider.addEventListener('input', () => {
      currentColor = hueToHex(Number(hueSlider.value));
      huePreview.style.background = currentColor;
    });

    eyedropperBtn.addEventListener('click', () => {
      eyedropperActive = !eyedropperActive;
      eyedropperBtn.classList.toggle('btn--dark', eyedropperActive);
      eyedropperBtn.classList.toggle('btn--light', !eyedropperActive);
    });

    panBtn.addEventListener('click', () => {
      panModeActive = !panModeActive;
      panBtn.classList.toggle('btn--dark', panModeActive);
      panBtn.classList.toggle('btn--light', !panModeActive);
      drawCanvas.classList.toggle('pan-mode', panModeActive);
    });

    function updatePenSizeLabel() {
      penSizeLabel.textContent = penSize.value + 'px';
    }
    penSize.addEventListener('input', updatePenSizeLabel);
    updatePenSizeLabel();

    // ---- Drawing / panning / pinch-zoom (Pointer Events) ----
    const activePointers = new Map();
    let pinchStartDist = null;
    let pinchStartZoom = null;
    let panDrag = null;

    function viewportPoint(evt) {
      const rect = viewport.getBoundingClientRect();
      return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
    }

    function canvasPoint(evt) {
      const rect = drawCanvas.getBoundingClientRect();
      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;
      return {
        x: (evt.clientX - rect.left) * scaleX,
        y: (evt.clientY - rect.top) * scaleY,
      };
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }
    function mid(a, b) {
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
    }

    function pickColorAt(x, y) {
      const merged = document.createElement('canvas');
      merged.width = drawCanvas.width;
      merged.height = drawCanvas.height;
      const mctx = merged.getContext('2d');
      mctx.drawImage(boardCanvas, 0, 0);
      mctx.drawImage(drawCanvas, 0, 0);
      const [r, g, b] = mctx.getImageData(Math.round(x), Math.round(y), 1, 1).data;
      return '#' + [r, g, b].map((v) => v.toString(16).padStart(2, '0')).join('');
    }

    function startStroke(evt) {
      const { x, y } = canvasPoint(evt);
      if (eyedropperActive) {
        currentColor = pickColorAt(x, y);
        hueSlider.value = 0;
        huePreview.style.background = currentColor;
        eyedropperActive = false;
        eyedropperBtn.classList.remove('btn--dark');
        eyedropperBtn.classList.add('btn--light');
        return;
      }
      drawingStroke = true;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.strokeStyle = currentColor;
      drawCtx.lineWidth = Number(penSize.value);
      drawCtx.beginPath();
      drawCtx.moveTo(x, y);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
    }

    function continueStroke(evt) {
      if (!drawingStroke) return;
      const { x, y } = canvasPoint(evt);
      drawCtx.lineTo(x, y);
      drawCtx.stroke();
    }

    function endStroke() {
      drawingStroke = false;
    }

    function startPan(evt) {
      drawCanvas.classList.add('panning');
      const p = viewportPoint(evt);
      panDrag = { startX: p.x, startY: p.y, startPanX: panX, startPanY: panY };
    }

    drawCanvas.addEventListener('pointerdown', (evt) => {
      if (optionsPanel.classList.contains('open')) {
        setOptionsOpen(false);
        return;
      }

      try {
        drawCanvas.setPointerCapture(evt.pointerId);
      } catch (e) {
        // Ignore: capture can fail if the pointer session ended before this
        // ran. Drawing/panning still work without it.
      }
      activePointers.set(evt.pointerId, viewportPoint(evt));

      if (activePointers.size >= 2) {
        drawingStroke = false;
        const pts = Array.from(activePointers.values());
        pinchStartDist = dist(pts[0], pts[1]);
        pinchStartZoom = zoom;
        const m = mid(pts[0], pts[1]);
        panDrag = { startX: m.x, startY: m.y, startPanX: panX, startPanY: panY, startZoom: zoom };
        return;
      }

      if (panModeActive) {
        startPan(evt);
        return;
      }

      startStroke(evt);
    });

    drawCanvas.addEventListener('pointermove', (evt) => {
      if (activePointers.has(evt.pointerId)) {
        activePointers.set(evt.pointerId, viewportPoint(evt));
      }

      if (activePointers.size >= 2 && pinchStartDist) {
        const pts = Array.from(activePointers.values());
        const d = dist(pts[0], pts[1]);
        const m = mid(pts[0], pts[1]);
        const newZoom = Math.min(maxZoom, Math.max(minZoom, pinchStartZoom * (d / pinchStartDist)));
        const worldX = (panDrag.startX - panDrag.startPanX) / panDrag.startZoom;
        const worldY = (panDrag.startY - panDrag.startPanY) / panDrag.startZoom;
        zoom = newZoom;
        panX = m.x - worldX * zoom;
        panY = m.y - worldY * zoom;
        clampPan();
        applyTransform();
        return;
      }

      if (panDrag && (panModeActive || activePointers.size === 1)) {
        const p = viewportPoint(evt);
        panX = panDrag.startPanX + (p.x - panDrag.startX);
        panY = panDrag.startPanY + (p.y - panDrag.startY);
        clampPan();
        applyTransform();
        return;
      }

      continueStroke(evt);
    });

    function endPointer(evt) {
      activePointers.delete(evt.pointerId);
      if (activePointers.size < 2) {
        pinchStartDist = null;
      }
      if (activePointers.size === 0) {
        panDrag = null;
        drawCanvas.classList.remove('panning');
      }
      endStroke();
    }
    drawCanvas.addEventListener('pointerup', endPointer);
    drawCanvas.addEventListener('pointercancel', endPointer);

    clearBtn.addEventListener('click', () => {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    });

    // ---- Upload / cooldown ----
    function setCooldownUi() {
      if (cooldownRemaining > 0) {
        uploadBtn.disabled = true;
        saveIcon.style.display = 'none';
        saveTimer.style.display = 'inline';
        saveTimer.textContent = Math.ceil(cooldownRemaining) + 's';
      } else {
        uploadBtn.disabled = false;
        saveIcon.style.display = '';
        saveTimer.style.display = 'none';
      }
    }
    setCooldownUi();
    setInterval(() => {
      if (cooldownRemaining > 0) {
        cooldownRemaining = Math.max(0, cooldownRemaining - 1);
        setCooldownUi();
      }
    }, 1000);

    uploadBtn.addEventListener('click', () => {
      if (uploadBtn.disabled) return;
      uploadBtn.disabled = true;
      showStatus('Uploading…');
      drawCanvas.toBlob((blob) => {
        const form = new FormData();
        form.append('drawing', blob, 'drawing.png');
        fetch(UPLOAD_URL, {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'X-CSRFToken': csrftoken },
          body: form,
        })
          .then((r) => r.json().then((data) => ({ ok: r.ok, data: data })))
          .then(({ ok, data }) => {
            if (ok && data.ok) {
              showStatus('Added to the whiteboard!', 2500);
              drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
              cooldownRemaining = COOLDOWN_SECONDS;
              setCooldownUi();
            } else if (data.error === 'cooldown') {
              cooldownRemaining = data.retry_after;
              showStatus('Please wait before uploading again.', 2500);
              setCooldownUi();
            } else {
              showStatus(data.error || 'Could not upload the drawing.', 3000);
              uploadBtn.disabled = false;
            }
          })
          .catch(() => {
            showStatus('Network error, please try again.', 3000);
            uploadBtn.disabled = false;
          });
      }, 'image/png');
    });
  })();
  </script>
</body>
</html>

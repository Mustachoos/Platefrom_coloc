{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo gallery</title>
  <style>
    body{font-family:Segoe UI, Tahoma, sans-serif;margin:16px;color:#223449}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
    .card{background:#fff;border-radius:10px;padding:8px;border:1px solid #edf2f7}
    .thumb{width:100%;height:160px;object-fit:cover;border-radius:8px}
    .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
    .like-btn{background:#ff6b6b;color:#fff;border:0;padding:6px 10px;border-radius:8px;cursor:pointer}
  </style>
</head>
<body>
  <h1>All photos</h1>
  <p>Click the heart to like a photo.</p>
  <div class="grid">
    {% for p in photos %}
    <div class="card" data-id="{{ p.id }}">
      <img class="thumb" src="{{ p.url }}" alt="{{ p.username }}">
      <div class="meta">
        <div>
          <div style="font-weight:700">{{ p.username }}</div>
          <div style="font-size:0.85rem;color:#556575">{{ p.uploaded_at }}</div>
        </div>
        <div>
          <button class="like-btn">♥ <span class="count">{{ p.likes_count }}</span></button>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>

<script>
function getCookie(name){
  const v=document.cookie.match('(^|;)\\s*'+name+'\\s*=\\s*([^;]+)');
  return v?v.pop():'';
}
const csrftoken = getCookie('csrftoken');

function updateCard(card, data){
  const count = card.querySelector('.count');
  if(count) count.textContent = data.likes_count;
}

document.querySelectorAll('.card').forEach(card=>{
  const btn = card.querySelector('.like-btn');
  btn.addEventListener('click', ()=>{
    const id = card.dataset.id;
    fetch(`/api/photos/${id}/like/`, {
      method: 'POST',
      headers: { 'X-CSRFToken': csrftoken },
    }).then(r=>r.json()).then(data=>{
      if(data && !data.error){
        updateCard(card, data);
      }
    });
  });
});
</script>
</body>
</html>

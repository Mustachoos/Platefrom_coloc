<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your name</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/site.css' %}">
</head>
<body>
  <main class="card">
    <h1>What's your name?</h1>
    <p class="hint">Pick the name your flatmates will see when you upload. We remember it on this device so next time is faster.</p>

    <form method="post">
      {% csrf_token %}
      <div class="form-row">
        <label for="{{ form.pseudo.id_for_label }}">Your name</label>
        {{ form.pseudo }}
        {% if form.pseudo.errors %}
          <div class="message error">{{ form.pseudo.errors }}</div>
        {% endif %}
      </div>
      <div class="form-actions">
        <button type="submit" class="btn primary">Continue</button>
        <a class="btn secondary" href="{% url 'gallery' %}">Browse Gallery</a>
      </div>
    </form>
  </main>
</body>
</html>

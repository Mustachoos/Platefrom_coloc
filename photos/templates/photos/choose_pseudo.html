<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your name</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/site.css' %}">
</head>
<body>
  <main class="card">
    <h1>What's your name?</h1>
    <p class="hint">Pick the name your flatmates will see when you upload. We remember it on this device so next time is faster.</p>

    <form method="post">
      {% csrf_token %}
      <label for="{{ form.pseudo.id_for_label }}">Your name</label>
      {{ form.pseudo }}
      {{ form.pseudo.errors }}
      <button type="submit">Continue</button>
    </form>
  </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your name</title>
  <style>
    :root {
      --bg-1: #f7fff6;
      --bg-2: #fff3e4;
      --ink: #203142;
      --soft: #597186;
      --accent: #0ea5e9;
      --accent-2: #f97316;
      --card: rgba(255, 255, 255, 0.94);
      --border: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      display: grid;
      place-items: center;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 15%, rgba(14, 165, 233, 0.16), transparent 34%),
        radial-gradient(circle at 90% 85%, rgba(249, 115, 22, 0.18), transparent 36%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
    }

    .card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(30, 52, 69, 0.16);
      padding: clamp(22px, 3.8vw, 34px);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      animation: rise 0.55s ease;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.3rem);
      line-height: 1.1;
    }

    .hint {
      margin: 12px 0 0;
      color: var(--soft);
      line-height: 1.45;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: 700;
      color: var(--ink);
    }

    input {
      width: 100%;
      margin-top: 6px;
      border: 2px solid #d4e4ee;
      border-radius: 13px;
      padding: 12px 14px;
      font-size: 1rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #fff;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.18);
    }

    button {
      margin-top: 22px;
      border: 0;
      border-radius: 13px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, var(--accent), #06b6d4);
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(14, 165, 233, 0.3);
      transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(14, 165, 233, 0.34);
    }

    .errorlist {
      list-style: none;
      margin: 8px 0 0;
      padding: 10px 12px;
      border-radius: 11px;
      font-size: 0.95rem;
      color: #9f1239;
      background: #ffe4ea;
      border: 1px solid #fecdd3;
    }

    .chips {
      margin-top: 16px;
      color: var(--soft);
      font-size: 0.92rem;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: #fff;
      border: 1px solid #e4edf3;
      border-radius: 999px;
      padding: 5px 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>What's your name?</h1>
    <p class="hint">Pick the name your flatmates will see when you upload. We remember it on this device so next time is faster.</p>

    <form method="post">
      {% csrf_token %}
      <label for="{{ form.pseudo.id_for_label }}">Your name</label>
      {{ form.pseudo }}
      {{ form.pseudo.errors }}
      <button type="submit">Continue</button>
    </form>

    <div class="chips" aria-hidden="true">
      <span class="chip">Quick setup</span>
      <span class="chip">Friendly names</span>
      <span class="chip">One-time choice</span>
    </div>
  </main>
</body>
</html>

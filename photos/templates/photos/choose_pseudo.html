<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Choose your name</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'photos/base.css' %}">
  <link rel="stylesheet" href="{% static 'photos/components.css' %}">
</head>
<body>
  <div class="page shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <main class="card" style="width:100%;max-width:420px;">
      <h1>What's your name?</h1>
      <p class="text-muted" style="margin-top:var(--space-2xs);margin-bottom:var(--space-md);">Pick the name your flatmates will see when you upload. We remember it on this device so next time is faster.</p>

      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="{{ form.pseudo.id_for_label }}">Your name</label>
          {{ form.pseudo }}
          {% if form.pseudo.errors %}
            <p class="text-sm" style="color:var(--danger);">{{ form.pseudo.errors }}</p>
          {% endif %}
        </div>
        <div class="flex flex-wrap gap-sm items-center" style="margin-top:var(--space-md);">
          <button type="submit" class="btn btn--dark">Continue</button>
          <a class="btn btn--outline" href="{% url 'gallery' %}">Browse Gallery</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>

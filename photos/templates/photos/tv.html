<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coloc TV</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/site.css' %}">
  <style>
    /* Minimal layout tweaks kept here; visual tokens live in site.css */
    .frame { position: absolute; inset: 0; border-radius:24px; border:2px solid rgba(255,255,255,0.7); box-shadow:0 20px 45px rgba(26,42,57,0.18); pointer-events:none; z-index:1 }
    .top-bar { position: fixed; z-index:3; top:28px; left:34px; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--card-border); border-radius:999px; padding:10px 16px; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); box-shadow:0 10px 30px rgba(27,43,56,0.12) }
    .dot { width:11px; height:11px; border-radius:50%; background:var(--mint); box-shadow:0 0 0 7px rgba(34,197,94,0.2); animation:pulse 2s ease infinite }
    @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(34,197,94,0.32)} 70%{box-shadow:0 0 0 11px rgba(34,197,94,0)} 100%{box-shadow:0 0 0 0 rgba(34,197,94,0)} }
    .title{font-size:1rem;letter-spacing:0.02em;font-weight:700;color:var(--ink)}
    #slide{position:relative;z-index:2;object-fit:contain;opacity:0;transition:opacity .8s ease;display:block;max-width:100%;max-height:84vh}
    #empty{position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);font-size:clamp(1.3rem,2.2vw,2rem);font-weight:700;color:var(--soft-ink);text-align:center;background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:18px 24px;box-shadow:0 12px 30px rgba(24,40,54,0.15);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
    #qr-box{position:static;z-index:3;background:var(--card);border:1px solid var(--card-border);padding:12px;border-radius:16px;text-align:center;box-shadow:0 12px 30px rgba(28,43,57,0.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    #qr-box img{display:block;width:128px;height:128px;border-radius:8px}
    #qr-box span{display:block;margin-top:8px;font-size:0.78rem;font-weight:600;letter-spacing:0.02em;color:var(--soft-ink)}
    @media(max-width:760px){.frame{inset:10px;border-radius:16px}.top-bar{top:16px;left:16px;padding:8px 12px}#qr-box{top:auto;right:16px;bottom:16px;padding:10px}#qr-box img{width:88px;height:88px}#empty{width:min(88vw,460px)}}
  </style>
</head>
<body class="tv-page">
  <div class="top-bar" aria-hidden="true">
    <span class="dot"></span>
    <span class="title">Coloc TV</span>
  </div>
  <div class="tv-content">
    <div class="tv-left">
      <div class="slide-wrap">
        <div class="frame" aria-hidden="true"></div>
        <img id="slide" alt="">
        <div id="empty">Waiting for photos&hellip;</div>

        <div id="new-photo-overlay" class="new-photo-overlay" aria-hidden="true">
          <img id="new-photo-img" class="new-photo-big" src="" alt="new photo">
          <div>
            <div id="new-photo-username" class="new-photo-username"></div>
            <div id="new-photo-sub" class="new-photo-sub">Just uploaded</div>
          </div>
        </div>
      </div>
    </div>
    <div class="tv-right">
      <div id="qr-box">
        <img src="{% url 'upload-qr-code' %}" alt="QR code to upload photos">
        <span>Scan to upload</span>
      </div>
      <aside class="tv-sidebar" id="leaderboard">
        <strong>Top liked photos</strong>
        <div id="top-list"></div>
      </aside>
    </div>
  </div>

  {% load static %}
  <script src="{% static 'photos/tv.js' %}"></script>
</body>
</html>

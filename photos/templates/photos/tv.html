<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coloc TV</title>
  <style>
    :root {
      --sky-1: #f7fff6;
      --sky-2: #fff6eb;
      --mint: #22c55e;
      --orange: #fb923c;
      --ink: #1f2a37;
      --soft-ink: #4b5f75;
      --card: rgba(255, 255, 255, 0.9);
      --card-border: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(34, 197, 94, 0.22), transparent 38%),
        radial-gradient(circle at 84% 18%, rgba(251, 146, 60, 0.2), transparent 34%),
        linear-gradient(145deg, var(--sky-1), var(--sky-2));
      color: var(--ink);
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      filter: blur(1px);
      z-index: 0;
      animation: float 18s ease-in-out infinite;
      pointer-events: none;
    }

    body::before {
      width: 420px;
      height: 420px;
      left: -120px;
      bottom: -130px;
      background: rgba(34, 197, 94, 0.24);
    }

    body::after {
      width: 320px;
      height: 320px;
      right: -90px;
      top: -110px;
      background: rgba(251, 146, 60, 0.26);
      animation-delay: -7s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.04); }
      100% { transform: translateY(0) scale(1); }
    }

    .frame {
      position: fixed;
      inset: 18px;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 20px 45px rgba(26, 42, 57, 0.18);
      pointer-events: none;
      z-index: 1;
    }

    .top-bar {
      position: fixed;
      z-index: 3;
      top: 28px;
      left: 34px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 999px;
      padding: 10px 16px;
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      box-shadow: 0 10px 30px rgba(27, 43, 56, 0.12);
    }

    .dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 7px rgba(34, 197, 94, 0.2);
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.32); }
      70% { box-shadow: 0 0 0 11px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }

    .title {
      font-size: 1rem;
      letter-spacing: 0.02em;
      font-weight: 700;
      color: var(--ink);
    }

    #slide {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease;
      display: block;
    }

    #empty {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(1.3rem, 2.2vw, 2rem);
      font-weight: 700;
      color: #fff;
      text-align: center;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 18px 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    }

    #qr-box {
      background: var(--card);
      border: 1px solid var(--card-border);
      padding: 12px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 12px 30px rgba(28, 43, 57, 0.14);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
    }

    #qr-box img {
      display: block;
      width: 128px;
      height: 128px;
      border-radius: 8px;
    }

    #qr-box span {
      display: block;
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: var(--soft-ink);
    }

    .new-photo-overlay {
      position: fixed;
      z-index: 6;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.92);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .new-photo-overlay.visible {
      opacity: 1;
      transform: scale(1);
    }

    .new-photo-banner {
      font-size: clamp(1.5rem, 4vw, 2.6rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
      background: linear-gradient(90deg, #ff004c, #ff9900, #fff200, #22c55e, #00c2ff, #7c3aed, #ff004c);
      background-size: 400% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: rainbow-shift 3s linear infinite;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.1);
    }

    @keyframes rainbow-shift {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }

    .new-photo-frame {
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 26px 60px rgba(20, 32, 44, 0.35);
      border: 4px solid rgba(255, 255, 255, 0.85);
      animation: gentle-float 3.2s ease-in-out infinite;
    }

    .new-photo-frame img {
      display: block;
      max-width: 62vw;
      max-height: 60vh;
      object-fit: contain;
    }

    @keyframes gentle-float {
      0%, 100% { transform: translateY(0) rotate(-1.2deg) scale(1); }
      50% { transform: translateY(-14px) rotate(1.2deg) scale(1.025); }
    }

    @media (max-width: 760px) {
      .frame {
        inset: 10px;
        border-radius: 16px;
      }

      .top-bar {
        top: 16px;
        left: 16px;
        padding: 8px 12px;
      }

      #qr-box img {
        width: 88px;
        height: 88px;
      }

      #empty {
        width: min(88vw, 460px);
      }

      .new-photo-frame img {
        max-width: 82vw;
        max-height: 52vh;
      }
    }
    /* Layout for main content: left photo, right sidebar */
    .content {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 18px;
      height: calc(100vh - 36px);
      padding: 18px;
      box-sizing: border-box;
    }

    .left {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      min-width: 0;
    }

    .sidebar {
      width: 360px;
      max-width: 40%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: stretch;
    }

    #slide {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(18,30,40,0.12);
    }

    #qr-box { display: block; }

    @media (max-width: 900px) {
      .sidebar { width: 280px; }
    }

    @media (max-width: 760px) {
      .content { flex-direction: column; height: auto; padding: 12px; }
      .sidebar { width: 100%; max-width: none; }
      #slide { height: 50vh; }
    }
  </style>
</head>
<body>
  <div class="frame" aria-hidden="true"></div>
  <div class="top-bar" aria-hidden="true">
    <span class="dot"></span>
    <span class="title">Coloc TV</span>
  </div>
  <main class="content">
    <div class="left">
      <img id="slide" alt="">
      <div id="empty">Let the party begin, upload your photos</div>
    </div>
    <aside class="sidebar">
      <div id="qr-box">
        <img src="{% url 'upload-qr-code' %}" alt="QR code to upload photos">
        <span>Scan to upload</span>
      </div>
      <div id="leaderboard" style="background:var(--card); border:1px solid var(--card-border); padding:12px; border-radius:12px; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);">
        <strong style="display:block; margin-bottom:8px; color:var(--soft-ink);">Top liked photos</strong>
        <div id="top-list"></div>
      </div>
    </aside>
  </main>
  <div id="new-photo-overlay" class="new-photo-overlay">
    <div class="new-photo-banner">New photo from <span id="new-photo-username"></span>!</div>
    <div class="new-photo-frame">
      <img id="new-photo-img" alt="">
    </div>
  </div>
  {% load static %}
  <script src="{% static 'photos/tv.js' %}"></script>
</body>
</html>

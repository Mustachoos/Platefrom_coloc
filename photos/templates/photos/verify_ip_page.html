<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if expired %}Lien expiré{% else %}IP vérifiée{% endif %}</title>
  <style>
    html,body{margin:0;padding:0;min-height:100vh;font-family:"Trebuchet MS","Segoe UI",sans-serif}
    body{
      display:flex;align-items:center;justify-content:center;text-align:center;
      background:{% if expired %}#dc2626{% else %}#16a34a{% endif %};color:#fff;
      padding:max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    .icon{font-size:5rem;line-height:1;margin-bottom:14px}
    h1{margin:0;font-size:1.8rem;font-weight:800}
  </style>
</head>
<body>
  {% if expired %}
  <div>
    <div class="icon">⚠️</div>
    <h1>Lien expiré</h1>
  </div>
  {% else %}
  <div>
    <div class="icon">✓</div>
    <h1>IP vérifiée</h1>
  </div>
  {% endif %}
</body>
</html>

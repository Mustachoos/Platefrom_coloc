<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vérifie tes emails</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'photos/base.css' %}">
  <link rel="stylesheet" href="{% static 'photos/components.css' %}">
</head>
<body>
  <div class="page shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <main class="card" style="width:100%;max-width:420px;">
      <h1>Vérifie tes emails</h1>
      <p class="text-muted" style="margin-top:var(--space-2xs);">Si un compte existe avec cet email, un lien de réinitialisation est en route. Ça peut prendre quelques minutes.</p>
      <div class="flex flex-wrap gap-sm items-center" style="margin-top:var(--space-md);">
        <a class="link" href="{% url 'staff-login' %}">Retour à la connexion</a>
      </div>
    </main>
  </div>
</body>
</html>

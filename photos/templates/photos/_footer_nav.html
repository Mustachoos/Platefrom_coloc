{% load icons %}
<nav class="bottom-nav">
  <a href="{% url 'upload' %}" class="bottom-nav__item{% if request.resolver_match.url_name == 'upload' %} is-active{% endif %}">
    {% icon 'upload' size=20 %}<span>Upload</span>
  </a>
  <a href="{% url 'gallery' %}" class="bottom-nav__item{% if request.resolver_match.url_name == 'gallery' or request.resolver_match.url_name == 'my-photos' %} is-active{% endif %}">
    {% icon 'photo' size=20 %}<span>Photos</span>
  </a>
  {% if whiteboard_enabled %}
  <a href="{% url 'whiteboard-draw' %}" class="bottom-nav__item{% if request.resolver_match.url_name == 'whiteboard-draw' %} is-active{% endif %}">
    {% icon 'palette' size=20 %}<span>Whiteboard</span>
  </a>
  {% endif %}
</nav>

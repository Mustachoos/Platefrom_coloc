<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reset your password</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'photos/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'photos/base.css' %}">
  <link rel="stylesheet" href="{% static 'photos/components.css' %}">
</head>
<body>
  <div class="page shell" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
    <main class="card" style="width:100%;max-width:420px;">
      <h1>Reset your password</h1>
      <p class="text-muted" style="margin-top:var(--space-2xs);margin-bottom:var(--space-md);">Enter the email on your admin account and we'll send you a link to set a new password.</p>

      <form method="post">
        {% csrf_token %}
        <div class="field">
          <label for="{{ form.email.id_for_label }}">Email</label>
          {{ form.email }}
        </div>
        <div class="flex flex-wrap gap-sm items-center" style="margin-top:var(--space-md);">
          <button type="submit" class="btn btn--dark">Send reset link</button>
          <a class="link text-sm" href="{% url 'staff-login' %}">Back to sign in</a>
        </div>
      </form>
    </main>
  </div>
</body>
</html>

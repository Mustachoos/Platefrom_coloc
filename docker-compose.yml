services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coloc_photos
      POSTGRES_USER: coloc
      POSTGRES_PASSWORD: coloc
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coloc -d coloc_photos"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./data/media:/app/data/media
      - ./credentials:/app/credentials
    ports:
      - "8000:8000"
    environment:
      DJANGO_DB_NAME: coloc_photos
      DJANGO_DB_USER: coloc
      DJANGO_DB_PASSWORD: coloc
      DJANGO_DB_HOST: db
      DJANGO_DB_PORT: "5432"
      GOOGLE_OAUTH_CLIENT_SECRET_FILE: "/app/credentials/client_secret.json"
      GOOGLE_OAUTH_TOKEN_FILE: "/app/credentials/token.json"
      GMAIL_SEND_TOKEN_FILE: "/app/credentials/gmail_send_token.json"
      GOOGLE_DRIVE_ROOT_FOLDER_ID: "${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
